version: '3.8'

services:
  general-deterrence:
    build: .
    container_name: general-deterrence
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - PORT=3000
    restart: unless-stopped
    # Healthcheck is inherited from the Dockerfile (uses 127.0.0.1 /api/health to avoid
    # the localhost IPv6/IPv4 mismatch, and a cheap endpoint that doesn't query the DB).
