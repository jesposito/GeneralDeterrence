app = 'generaldeterrence'
primary_region = 'syd'

[build]
  image = "ghcr.io/jesposito/generaldeterrence:latest"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  method = "get"
  path = "/api/health"

[[mounts]]
  source = "gd_data"
  destination = "/data"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
